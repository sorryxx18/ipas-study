<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>出題熱區分析 — IPAS 備考系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --border: #cbd5e1;
  --text: #0f172a;
  --muted: #475569;
  --accent: #2563eb;
  --green: #15803d;
  --red: #b91c1c;
  --yellow: #b45309;
  --orange: #c2410c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "LXGW WenKai TC", "PingFang TC", "Microsoft JhengHei", sans-serif; min-height: 100vh; max-width: 600px; margin: 0 auto; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; padding-bottom: 40px; }
@media (min-width: 640px) { body { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }

html.dark {
  --bg: #0f172a;
  --surface: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --orange: #f97316;
}

a { color: var(--accent); }

/* Header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 17px; font-weight: 700; color: var(--accent); }
.back-link { font-size: 13px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.back-link:hover { color: var(--accent); }
.theme-btn { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 16px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.2s; }
.theme-btn:hover { border-color: var(--accent); }

/* Intro */
.intro { padding: 16px; }
.intro-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.intro-desc { font-size: 13px; color: var(--muted); line-height: 1.7; }

/* Subject toggle */
.subject-toggle { display: flex; gap: 8px; padding: 0 16px 16px; }
.subject-btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.subject-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.08); }

/* Summary stats */
.summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px 16px; }
.summary-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; }
.summary-num { font-size: 18px; font-weight: 700; }
.summary-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
.c-hot { color: var(--red); }
.c-warn { color: var(--yellow); }
.c-done { color: var(--green); }
.c-none { color: var(--muted); }

/* Section headers */
.section-title { font-size: 15px; font-weight: 700; padding: 4px 16px 10px; display: flex; align-items: center; gap: 6px; }
.section-sub { font-size: 12px; color: var(--muted); font-weight: 400; }

/* Top hotspot cards */
.top-list { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.top-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.top-rank { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 20px; text-align: center; flex-shrink: 0; }
.top-body { flex: 1; min-width: 0; }
.top-title-row { display: flex; align-items: baseline; gap: 6px; }
.top-seg-title { font-size: 14px; font-weight: 600; }
.top-seg-id { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.top-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.top-hit { font-size: 18px; font-weight: 700; color: var(--accent); flex-shrink: 0; min-width: 34px; text-align: right; }
.top-hit-unit { font-size: 10px; color: var(--muted); font-weight: 400; }

/* Observation note */
.observation-box { margin: 4px 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.observation-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.observation-body { display: none; margin-top: 10px; font-size: 13px; line-height: 1.8; color: var(--muted); }
.observation-body.open { display: block; }
.observation-body p { margin-bottom: 10px; }
.observation-body p:last-child { margin-bottom: 0; }

/* Full segment list */
.filter-row { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; }
.filter-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; }
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.08); }

.seg-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.seg-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.seg-card.dim { opacity: 0.55; }
.seg-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.seg-icon { font-size: 16px; flex-shrink: 0; }
.seg-id { font-size: 11px; color: var(--muted); flex-shrink: 0; min-width: 22px; }
.seg-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; }
.seg-hit { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.seg-arrow { font-size: 10px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.seg-card.open .seg-arrow { transform: rotate(180deg); }
.seg-detail { display: none; padding: 0 14px 14px; }
.seg-card.open .seg-detail { display: block; }
.seg-status-line { font-size: 11px; color: var(--muted); margin-bottom: 8px; padding-top: 4px; border-top: 1px solid var(--border); padding-top: 10px; }
.seg-q { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; line-height: 1.6; }
.seg-q:last-child { margin-bottom: 0; }
.seg-q-id { color: var(--accent); font-weight: 600; font-size: 11px; display: block; margin-bottom: 2px; word-break: break-all; }
.seg-q-note { color: var(--text); }
.seg-empty { font-size: 12px; color: var(--muted); font-style: italic; }

.loading { text-align: center; padding: 40px; color: var(--muted); }

.footer-note { padding: 24px 16px 8px; text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="/">← 返回首頁</a>
  <h1>📊 出題熱區分析</h1>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切換主題">🌙</button>
</div>

<div class="intro">
  <div class="intro-title">哪些段落最該優先讀？</div>
  <div class="intro-desc">逐題語意判讀 260 題官方＋模擬題，對應到讀書指引段落，統計命中題數並比對目前讀書進度。🔥 代表常考(≥3題)但還沒讀，⚠️ 代表有考過(≥1題)但還沒讀，✅ 代表常考且已讀完，⭕ 代表目前完全沒考過。</div>
</div>

<div class="subject-toggle">
  <button class="subject-btn active" id="s1Btn" onclick="switchSubject(1)">科目一 AI規劃</button>
  <button class="subject-btn" id="s3Btn" onclick="switchSubject(3)">科目三 機器學習</button>
</div>

<div id="app"><div class="loading">載入中...</div></div>

<div class="footer-note">資料來源：exam_emphasis_s1.md / exam_emphasis_s3.md 逐題語意分析報告</div>

<script>
const API = '';
let currentSubject = 1;
let dataCache = { 1: null, 3: null };
let currentFilter = 'all';
const segOpenState = {};

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
(function initTheme() {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = '☀️';
    });
  }
})();

async function loadSubjectData(n) {
  if (dataCache[n]) return dataCache[n];
  const res = await fetch(`/exam_emphasis_s${n}.json`);
  const json = await res.json();
  dataCache[n] = json;
  return json;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function switchSubject(n) {
  currentSubject = n;
  document.getElementById('s1Btn').classList.toggle('active', n === 1);
  document.getElementById('s3Btn').classList.toggle('active', n === 3);
  currentFilter = 'all';
  render();
}

async function render() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">載入中...</div>';
  const data = await loadSubjectData(currentSubject);
  if (!data || !data.segments) {
    app.innerHTML = '<div class="loading">資料載入失敗</div>';
    return;
  }

  const counts = { hot: 0, warn: 0, done: 0, none: 0 };
  data.segments.forEach(s => { counts[s.priority] = (counts[s.priority] || 0) + 1; });

  const topSegs = data.topSegmentIds
    .map(id => data.segments.find(s => s.id === id))
    .filter(Boolean);

  let html = '';

  // Summary stats
  html += `<div class="summary-row">
    <div class="summary-stat"><div class="summary-num c-hot">${counts.hot || 0}</div><div class="summary-label">🔥 優先讀</div></div>
    <div class="summary-stat"><div class="summary-num c-warn">${counts.warn || 0}</div><div class="summary-label">⚠️ 該補</div></div>
    <div class="summary-stat"><div class="summary-num c-done">${counts.done || 0}</div><div class="summary-label">✅ 沒問題</div></div>
    <div class="summary-stat"><div class="summary-num c-none">${counts.none || 0}</div><div class="summary-label">⭕ 沒考過</div></div>
  </div>`;

  // Top hotspots
  html += `<div class="section-title">🎯 TOP ${topSegs.length} 出題熱區 <span class="section-sub">（依命中題數排序）</span></div>`;
  html += '<div class="top-list">';
  topSegs.forEach((s, i) => {
    html += `<div class="top-card">
      <div class="top-rank">${i + 1}</div>
      <div class="top-body">
        <div class="top-title-row">
          <span class="top-seg-title">${s.priorityIcon} ${escapeHtml(s.title)}</span>
        </div>
        <div class="top-meta">段落 #${s.id} · ${s.completed ? '已讀完' : '尚未讀到'}</div>
      </div>
      <div class="top-hit">${s.hitCount}<span class="top-hit-unit">題</span></div>
    </div>`;
  });
  html += '</div>';

  // Observation
  if (data.overallObservation && data.overallObservation.length) {
    html += `<div class="observation-box">
      <div class="observation-toggle" onclick="this.nextElementSibling.classList.toggle('open'); this.querySelector('.arr').style.transform = this.nextElementSibling.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)'">
        <span>📝 整體觀察（點開閱讀完整分析）</span>
        <span class="arr" style="transition:transform .2s">▼</span>
      </div>
      <div class="observation-body">
        ${data.overallObservation.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
      </div>
    </div>`;
  }

  // Filter row + full segment list
  html += `<div class="section-title">📋 全部段落 <span class="section-sub">（依段落順序，共 ${data.segments.length} 段）</span></div>`;
  html += `<div class="filter-row">
    <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</button>
    <button class="filter-btn ${currentFilter === 'hot' ? 'active' : ''}" onclick="setFilter('hot')">🔥 優先讀</button>
    <button class="filter-btn ${currentFilter === 'warn' ? 'active' : ''}" onclick="setFilter('warn')">⚠️ 該補</button>
    <button class="filter-btn ${currentFilter === 'done' ? 'active' : ''}" onclick="setFilter('done')">✅ 沒問題</button>
    <button class="filter-btn ${currentFilter === 'none' ? 'active' : ''}" onclick="setFilter('none')">⭕ 沒考過</button>
  </div>`;

  html += '<div class="seg-list">';
  data.segments.forEach(s => {
    if (currentFilter !== 'all' && s.priority !== currentFilter) return;
    const isDim = s.priority === 'none';
    const isOpen = !!segOpenState[s.id];
    html += `<div class="seg-card ${isDim ? 'dim' : ''} ${isOpen ? 'open' : ''}" id="seg-${s.id}">
      <div class="seg-header" onclick="toggleSeg(${s.id}, ${currentSubject})">
        <span class="seg-icon">${s.priorityIcon}</span>
        <span class="seg-id">#${s.id}</span>
        <span class="seg-title">${escapeHtml(s.title)}</span>
        <span class="seg-hit">${s.hitCount} 題</span>
        <span class="seg-arrow">▼</span>
      </div>
      <div class="seg-detail">
        <div class="seg-status-line">讀書進度：${s.completed ? '✅ 已完成' : '⏳ 尚未讀到'} ・ ${escapeHtml(s.priorityLabel)}</div>
        ${s.hitQuestions.length
          ? s.hitQuestions.map(q => `<div class="seg-q"><span class="seg-q-id">${escapeHtml(q.id)}</span><span class="seg-q-note">${escapeHtml(q.note)}</span></div>`).join('')
          : '<div class="seg-empty">目前題庫沒有命中這個段落的題目。</div>'}
      </div>
    </div>`;
  });
  html += '</div>';

  app.innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  render();
}

function toggleSeg(id, subject) {
  const key = subject + '-' + id;
  segOpenState[id] = !segOpenState[id];
  const el = document.getElementById('seg-' + id);
  if (el) el.classList.toggle('open');
}

render();
</script>

</body>
</html>
